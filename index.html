<!doctype html>
<html lang="pt-BR" data-tema="escuro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkpoint — seu hub de jogos</title>
  <meta name="description" content="Diário de jogos com retrospectiva do ano, central de speedrun, recomps, Roda no meu PC?, torneios e recomendações. Tudo num lugar só.">
  <meta name="theme-color" content="#161a21">
  <link rel="icon" href="assets/icone.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Figtree:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Aplica o tema salvo antes de desenhar a página (evita piscar).
    try {
      var t = JSON.parse(localStorage.getItem('checkpoint:pref:tema'));
      if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'escuro';
      document.documentElement.dataset.tema = t;
    } catch (e) { /* sem armazenamento: fica o tema padrão */ }
  </script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="pular" href="#palco">Pular para o conteúdo</a>

  <header class="topo">
    <a class="marca" href="#/inicio" aria-label="Checkpoint, ir para o início">
      <svg class="marca-icone" viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="26" height="26" rx="8" class="marca-fundo"/><path d="M11 24V8" class="marca-traco"/><path d="M11 9h10l-2.6 4.5L21 18H11" class="marca-bandeira"/></svg>
      <span>Checkpoint</span>
    </a>
    <nav class="nav" aria-label="Abas do Checkpoint">
      <ul id="nav-lista"></ul>
    </nav>
    <div class="topo-acoes" id="topo-acoes">
      <button class="btn-icone" id="botao-tema" type="button" aria-label="Mudar para o tema claro"></button>
    </div>
  </header>

  <main id="palco" class="palco" tabindex="-1"></main>

  <footer class="rodape">
    <p>Checkpoint · feito por Samuel Mota Ramos e Arthur · Desenvolvimento de Interfaces, UniCEUB Asa Norte · 2026</p>
    <p class="rodape-nota">Capas e resumos: Wikipedia e Steam. Recordes: speedrun.com. Projetos: GitHub. O Checkpoint não hospeda nem distribui jogos.</p>
  </footer>

  <noscript><p class="noscript">O Checkpoint precisa de JavaScript ligado para funcionar.</p></noscript>
</body>
</html>
